<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💾</text></svg>"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --fg: #e8e8e8;
        --fg-muted: #999;
        --bg: #0a0a0a;
        --border: #2a2a2a;
        --surface: #111;
      }

      body {
        font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas",
          monospace;
        background: var(--bg);
        color: var(--fg);
        max-width: 52rem;
        margin: 0 auto;
        padding: 3rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        position: relative;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        z-index: 0;
        pointer-events: none;
      }

      body > *:not(canvas) {
        position: relative;
        z-index: 1;
      }

      a {
        color: var(--fg);
        text-decoration: none;
        transition: opacity 0.15s ease;
      }

      a:hover {
        opacity: 0.7;
      }

      /* --- Profile --- */
      .profile {
        display: flex;
        align-items: center;
        gap: 2rem;
      }

      .avatar {
        width: 10rem;
        height: 10rem;
        border-radius: 50%;
        border: 2px solid var(--border);
        flex-shrink: 0;
      }

      .avatar-sm {
        display: none;
      }

      .info h1 {
        font-size: 1.75rem;
        font-weight: 400;
        letter-spacing: -0.02em;
      }

      .info h2 {
        font-size: 0.875rem;
        font-weight: 400;
        color: var(--fg-muted);
        margin-top: 0.25rem;
      }

      .info h2 a {
        color: var(--fg);
        border-bottom: 1px solid var(--border);
      }

      .info h2 a:hover {
        opacity: 0.7;
      }

      /* --- Links --- */
      .links {
        display: flex;
        gap: 0;
        margin-top: 1.25rem;
      }

      .links a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.75rem;
        height: 2.75rem;
        border: 1px solid var(--border);
        color: var(--fg-muted);
        transition: color 0.15s ease, border-color 0.15s ease;
      }

      .links a:first-child {
        border-radius: 4px 0 0 4px;
      }

      .links a:last-child {
        border-radius: 0 4px 4px 0;
      }

      .links a + a {
        border-left: none;
      }

      .links a:hover {
        color: var(--fg);
        border-color: var(--fg-muted);
        opacity: 1;
      }

      .links svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      /* --- Blog button --- */
      .blog-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.8125rem;
        color: var(--fg-muted);
        transition: color 0.15s ease, border-color 0.15s ease;
      }

      .blog-link:hover {
        color: var(--fg);
        border-color: var(--fg-muted);
        opacity: 1;
      }

      .blog-link svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      /* --- README box --- */
      .readme-box {
        width: 100%;
        margin-top: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }

      .titlebar {
        font-size: 0.75rem;
        text-align: center;
        padding: 0.5rem 0;
        background-color: var(--surface);
        border-bottom: 1px solid var(--border);
        position: relative;
        color: var(--fg-muted);
      }

      .titlebar::before {
        content: "";
        position: absolute;
        height: 0.6rem;
        width: 0.6rem;
        border-radius: 50%;
        top: 50%;
        transform: translateY(-50%);
        left: 0.75rem;
        background-color: #555;
        box-shadow: 1rem 0 0 0 #444, 2rem 0 0 0 #333;
      }

      .readme-content {
        padding: 1.5rem;
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--fg-muted);
      }

      .readme-content h1,
      .readme-content h2,
      .readme-content h3,
      .readme-content h4,
      .readme-content h5,
      .readme-content h6 {
        color: var(--fg);
        font-weight: 500;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
      }

      .readme-content h1 { font-size: 1.5rem; }
      .readme-content h2 { font-size: 1.25rem; }
      .readme-content h3 { font-size: 1.1rem; }

      .readme-content p {
        margin-bottom: 1em;
      }

      .readme-content a {
        color: var(--fg);
        border-bottom: 1px solid var(--border);
      }

      .readme-content ul,
      .readme-content ol {
        padding-left: 1.5rem;
        margin-bottom: 1em;
      }

      .readme-content li {
        margin-bottom: 0.25em;
      }

      .readme-content code {
        font-family: inherit;
        background: var(--surface);
        padding: 0.15em 0.35em;
        border-radius: 3px;
        font-size: 0.85em;
      }

      .readme-content pre {
        background: var(--surface);
        padding: 1rem;
        border-radius: 4px;
        overflow-x: auto;
        margin-bottom: 1em;
      }

      .readme-content pre code {
        background: none;
        padding: 0;
      }

      .readme-content img {
        max-width: 100%;
        border-radius: 4px;
      }

      .loading {
        text-align: center;
        padding: 2rem;
        color: var(--fg-muted);
      }

      .loading h3 {
        font-size: 1rem;
        font-weight: 400;
        margin-bottom: 0.5rem;
      }

      .loading p {
        font-size: 0.8125rem;
      }

      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blink 1s infinite;
      }

      /* --- Responsive --- */
      @media (max-width: 640px) {
        .avatar {
          display: none;
        }

        .avatar-sm {
          display: block;
          width: 4rem;
          height: 4rem;
          border-radius: 50%;
          border: 2px solid var(--border);
          flex-shrink: 0;
        }

        .profile {
          flex-direction: column;
          text-align: center;
        }

        .profile .info {
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .top-row {
          display: flex;
          align-items: center;
          gap: 1rem;
        }

        .info h1 {
          font-size: 1.25rem;
        }
      }
    </style>
    <script defer data-domain="reb.gg" src="https://a.reb.gg/js/script.js"></script>
    <script type="module">
      // Readme
      const replaceHTML = async (element) => {
        const url = element.getAttribute("data-replace-html");
        const data = await fetch(url, {
          headers: { accept: "application/vnd.github.v3.html" },
        });
        if (!data.ok) {
          element.innerHTML = `
            <div class="loading">
              <h3>Can't reach URL</h3>
              <p>Well this is awkward.</p>
            </div>
          `;
          return;
        }
        element.innerHTML = await data.text();
      };

      try {
        const readmeContainer = document.querySelector("[data-replace-html]");
        replaceHTML(readmeContainer);
      } catch (e) {
        console.log(e);
      }

      // Dither background
      const canvas = document.querySelector("canvas");
      const ctx = canvas.getContext("2d");

      // Bayer 4x4 threshold matrix (normalized to 0-1)
      const bayer4 = [
        [0 / 16, 8 / 16, 2 / 16, 10 / 16],
        [12 / 16, 4 / 16, 14 / 16, 6 / 16],
        [3 / 16, 11 / 16, 1 / 16, 9 / 16],
        [15 / 16, 7 / 16, 13 / 16, 5 / 16],
      ];

      const pixelSize = 4;
      let time = 0;
      let animId;

      const resize = () => {
        canvas.width = Math.ceil(window.innerWidth / pixelSize);
        canvas.height = Math.ceil(window.innerHeight / pixelSize);
      };
      resize();
      window.addEventListener("resize", resize);

      const draw = () => {
        const w = canvas.width;
        const h = canvas.height;
        const imageData = ctx.createImageData(w, h);
        const data = imageData.data;

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            // Create a soft radial gradient from center
            const cx = w / 2;
            const cy = h / 2;
            const maxDist = Math.sqrt(cx * cx + cy * cy);
            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy) / maxDist;

            // Gentle animated noise field using sine waves
            const n =
              Math.sin(x * 0.08 + time * 0.4) *
              Math.cos(y * 0.06 - time * 0.3) *
              0.15 +
              Math.sin((x + y) * 0.04 + time * 0.2) * 0.1;

            // Intensity: bright center fading to edges, plus noise
            const intensity = Math.max(0, Math.min(1, (1 - dist * 0.9) * 0.2 + n));

            // Bayer dither threshold
            const threshold = bayer4[y % 4][x % 4];
            const on = intensity > threshold;

            const idx = (y * w + x) * 4;
            if (on) {
              data[idx] = 220;     // R
              data[idx + 1] = 220; // G
              data[idx + 2] = 220; // B
              data[idx + 3] = 18;  // A - very subtle
            } else {
              data[idx + 3] = 0;
            }
          }
        }

        ctx.putImageData(imageData, 0, 0);
        time += 0.02;
        animId = requestAnimationFrame(draw);
      };

      draw();
    </script>
